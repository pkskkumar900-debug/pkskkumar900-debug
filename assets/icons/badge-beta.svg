<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 64" width="100%" height="100%">
  <defs>
    <!-- Deep Red Neon Glow Filter -->
    <filter id="crimson-glow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF001E" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FF3B4D" flood-opacity="0.9" />
    </filter>

    <!-- Glass Pill Body Gradient -->
    <linearGradient id="glass-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180507" />
      <stop offset="35%" stop-color="#0B0203" />
      <stop offset="70%" stop-color="#050102" />
      <stop offset="100%" stop-color="#1A0205" />
    </linearGradient>

    <!-- Neon Rim Stroke Gradient -->
    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5A" />
      <stop offset="25%" stop-color="#FF001E" />
      <stop offset="50%" stop-color="#8A000A" />
      <stop offset="75%" stop-color="#FF001E" />
      <stop offset="100%" stop-color="#FF5260" />
    </linearGradient>

    <!-- Top Gloss Arc Gradient -->
    <linearGradient id="top-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#FFA8B0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF001E" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Bottom Wave Gradient -->
    <linearGradient id="liquid-wave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF001E" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#99000C" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#FF1A2A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FF5E6B" stop-opacity="0.9" />
    </linearGradient>

    <!-- B Red 3D Gradient -->
    <linearGradient id="b-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5967" />
      <stop offset="45%" stop-color="#FF0A1C" />
      <stop offset="100%" stop-color="#B8000E" />
    </linearGradient>

    <!-- eta Chrome Silver Gradient -->
    <linearGradient id="eta-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F3F5F7" />
      <stop offset="80%" stop-color="#D1D8E0" />
      <stop offset="100%" stop-color="#9BA5B1" />
    </linearGradient>

    <!-- Sphere Drop Gradient -->
    <radialGradient id="drop-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFA4AD" />
      <stop offset="35%" stop-color="#FF1426" />
      <stop offset="100%" stop-color="#4D0005" />
    </radialGradient>
  </defs>

  <!-- 1. Ambient Neon Halo Base -->
  <rect x="7" y="7" width="146" height="50" rx="25" fill="none" stroke="#FF001A" stroke-width="3" filter="url(#crimson-glow)" opacity="0.85" />

  <!-- 2. Dark Obsidian Glass Body -->
  <rect x="7" y="7" width="146" height="50" rx="25" fill="url(#glass-body)" stroke="url(#neon-stroke)" stroke-width="1.8" />

  <!-- 3. Organic Fluid Waves Inside Glass (Left) -->
  <path d="M 8 32 C 12 44, 26 53, 46 53 C 36 49, 26 38, 20 30 C 14 24, 10 26, 8 32 Z" fill="url(#liquid-wave)" opacity="0.65" />
  <path d="M 14 32 C 18 42, 28 48, 42 48 C 30 45, 22 36, 17 31 Z" fill="#FF1A2B" opacity="0.5" />

  <!-- 4. Organic Fluid Waves Inside Glass (Right) -->
  <path d="M 152 32 C 148 44, 134 53, 114 53 C 124 49, 134 38, 140 30 C 146 24, 150 26, 152 32 Z" fill="url(#liquid-wave)" opacity="0.65" />
  <path d="M 146 32 C 142 42, 132 48, 118 48 C 130 45, 138 36, 143 31 Z" fill="#FF1A2B" opacity="0.5" />

  <!-- 5. Top Specular Glass Reflection Highlight -->
  <path d="M 30 11 Q 80 14 130 11 Q 80 17 30 11 Z" fill="url(#top-gloss)" />
  <path d="M 36 9.5 Q 80 12 124 9.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

  <!-- 6. Bottom Edge Rim Glint -->
  <path d="M 42 55.5 Q 80 57.5 118 55.5" stroke="#FF2E3E" stroke-width="1.4" stroke-linecap="round" opacity="0.85" />

  <!-- 7. Ambient Liquid Spheres (Left) -->
  <circle cx="26" cy="27" r="3" fill="url(#drop-grad)" filter="drop-shadow(0 0 2px #FF001A)" />
  <circle cx="25" cy="26" r="0.8" fill="#FFFFFF" opacity="0.8" />
  <circle cx="30" cy="34" r="1.6" fill="url(#drop-grad)" opacity="0.85" />

  <!-- 8. Ambient Liquid Spheres (Right) -->
  <circle cx="134" cy="34" r="3.6" fill="url(#drop-grad)" filter="drop-shadow(0 0 2px #FF001A)" />
  <circle cx="132.8" cy="32.8" r="1" fill="#FFFFFF" opacity="0.85" />
  <circle cx="127" cy="39" r="1.6" fill="url(#drop-grad)" opacity="0.85" />
  <circle cx="130" cy="40.5" r="2" fill="url(#drop-grad)" opacity="0.85" />

  <!-- 9. Stylized 3D "Beta" Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="31" letter-spacing="0.5">
    <!-- Deep Drop Shadows -->
    <text x="43" y="43" fill="#000000" opacity="0.8">Beta</text>
    <text x="42.5" y="42.5" fill="#1A0003" opacity="0.9">Beta</text>
    <!-- Foreground Text: B in red gradient, eta in chrome gradient -->
    <text x="42" y="42">
      <tspan fill="url(#b-grad)">B</tspan><tspan fill="url(#eta-grad)">eta</tspan>
    </text>
  </g>
</svg>