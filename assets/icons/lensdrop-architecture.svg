<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162032" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Tier Box Gradients -->
    <linearGradient id="tier-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="tier-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="tier-pres" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.04" />
    </linearGradient>

    <!-- Glowing Borders -->
    <linearGradient id="border-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="border-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="border-indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="border-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.25" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.25" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #F8FAFC; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94A3B8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 600; letter-spacing: 0.3px; }
  </style>

  <!-- Outer Canvas Card -->
  <rect x="2" y="2" width="916" height="376" rx="16" fill="url(#bg-grad)" stroke="url(#border-main)" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06">
    <path d="M 0 45 L 920 45 M 0 90 L 920 90 M 0 135 L 920 135 M 0 180 L 920 180 M 0 225 L 920 225 M 0 270 L 920 270 M 0 315 L 920 315 M 0 360 L 920 360" stroke="#FFFFFF" stroke-width="1" />
    <path d="M 50 0 L 50 380 M 150 0 L 150 380 M 250 0 L 250 380 M 350 0 L 350 380 M 450 0 L 450 380 M 550 0 L 550 380 M 650 0 L 650 380 M 750 0 L 750 380 M 850 0 L 850 380" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Bar -->
  <g id="header">
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="5" fill="#EF4444" />
    <circle cx="44" cy="24" r="5" fill="#F59E0B" />
    <circle cx="60" cy="24" r="5" fill="#10B981" />

    <!-- Diagram Title -->
    <text x="85" y="28" class="mono" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1">LENSDROP // EVENT ARCHITECTURE &amp; DATA PIPELINE</text>

    <!-- Top-Right Status Pills -->
    <rect x="715" y="14" width="95" height="20" rx="10" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" />
    <circle cx="725" cy="24" r="3" fill="#38BDF8" />
    <text x="733" y="27.5" class="mono" font-size="9" font-weight="600" fill="#38BDF8">REAL-TIME</text>

    <rect x="818" y="14" width="82" height="20" rx="10" fill="#065F46" fill-opacity="0.3" stroke="#34D399" stroke-width="1" />
    <circle cx="828" cy="24" r="3" fill="#34D399" />
    <text x="836" y="27.5" class="mono" font-size="9" font-weight="600" fill="#34D399">ACTIVE PWA</text>
  </g>

  <line x1="2" y1="44" x2="918" y2="44" stroke="#1E293B" stroke-width="1" />

  <!-- ==================== TIER 1: CLIENT SIDE ==================== -->
  <g id="tier-1">
    <!-- Zone Container -->
    <rect x="20" y="58" width="260" height="302" rx="12" fill="url(#tier-client)" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1.2" />
    <rect x="32" y="70" width="130" height="22" rx="6" fill="#0369A1" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1" />
    <text x="40" y="85" class="mono" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="0.5">STAGE 01 // CLIENT</text>

    <!-- Node 1A: Guest QR Scan -->
    <g filter="url(#glow-cyan)">
      <rect x="36" y="106" width="228" height="92" rx="10" fill="url(#card-grad)" stroke="url(#border-cyan)" stroke-width="1.4" />
      <!-- Icon: Phone / QR -->
      <rect x="50" y="120" width="36" height="36" rx="8" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
      <path d="M59 129 h5 v5 h-5 z M67 129 h5 v5 h-5 z M59 137 h5 v5 h-5 z M67 137 h2 v5 h-2 z" fill="#38BDF8" />
      <path d="M56 126 h4 v-2 h-4 v4 h2 z M76 126 h-4 v-2 h4 v4 h-2 z M56 146 h4 v2 h-4 v-4 h2 z M76 146 h-4 v2 h4 v-4 h-2 z" fill="#38BDF8" />
      
      <text x="96" y="134" class="label">Guest QR Scan</text>
      <text x="96" y="150" class="sub">Zero app installation</text>
      <text x="96" y="164" class="sub">Instant camera access</text>

      <!-- Pill -->
      <rect x="50" y="168" width="88" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="56" y="180.5" class="tag" fill="#7DD3FC">EVENT TOKEN</text>
    </g>

    <!-- Intra-Tier Connector 1A -> 1B -->
    <line x1="150" y1="198" x2="150" y2="230" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-cyan)" />

    <!-- Node 1B: React 19 PWA -->
    <g filter="url(#glow-cyan)">
      <rect x="36" y="234" width="228" height="110" rx="10" fill="url(#card-grad)" stroke="url(#border-cyan)" stroke-width="1.4" />
      <!-- Icon: React / Lightning -->
      <rect x="50" y="248" width="36" height="36" rx="8" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
      <path d="M68 253 L61 266 L67 266 L63 279 L75 264 L69 264 Z" fill="#38BDF8" />
      
      <text x="96" y="262" class="label">React 19 PWA</text>
      <text x="96" y="278" class="sub">In-browser chunk engine</text>
      <text x="96" y="292" class="sub">EXIF &amp; lossless preservation</text>

      <!-- Badges -->
      <rect x="50" y="306" width="94" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="56" y="318.5" class="tag" fill="#7DD3FC">TYPESCRIPT</text>

      <rect x="150" y="306" width="102" height="18" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="156" y="318.5" class="tag" fill="#7DD3FC">BLOB CHUNKING</text>
    </g>
  </g>

  <!-- Flow Connector: Client -> Storage -->
  <g>
    <path d="M 264 289 C 285 289, 290 152, 328 152" fill="none" stroke="#818CF8" stroke-width="2.2" stroke-dasharray="4,4" marker-end="url(#arrow-indigo)" />
    <!-- Connector Badge -->
    <rect x="272" y="200" width="76" height="24" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" />
    <text x="279" y="215" class="mono" font-size="8.5" font-weight="700" fill="#A5B4FC">P2P UPLOAD</text>
  </g>

  <!-- ==================== TIER 2: CLOUD & DB ==================== -->
  <g id="tier-2">
    <!-- Zone Container -->
    <rect x="330" y="58" width="270" height="302" rx="12" fill="url(#tier-cloud)" stroke="#6366F1" stroke-opacity="0.25" stroke-width="1.2" />
    <rect x="342" y="70" width="170" height="22" rx="6" fill="#4338CA" fill-opacity="0.4" stroke="#818CF8" stroke-width="1" />
    <text x="350" y="85" class="mono" font-size="10" font-weight="700" fill="#A5B4FC" letter-spacing="0.5">STAGE 02 // FIREBASE &amp; GCP</text>

    <!-- Node 2A: Cloud Storage Bucket -->
    <g filter="url(#glow-indigo)">
      <rect x="346" y="106" width="238" height="92" rx="10" fill="url(#card-grad)" stroke="url(#border-indigo)" stroke-width="1.4" />
      <!-- Icon: Storage Bucket -->
      <rect x="360" y="120" width="36" height="36" rx="8" fill="#4F46E5" fill-opacity="0.25" stroke="#818CF8" stroke-width="1" />
      <path d="M370 131 c0 -2.5 7 -4 16 -4 s16 1.5 16 4 v14 c0 2.5 -7 4 -16 4 s-16 -1.5 -16 -4 z" fill="none" stroke="#818CF8" stroke-width="1.8" />
      <path d="M370 137 c0 2.5 7 4 16 4 s16 -1.5 16 -4" fill="none" stroke="#818CF8" stroke-width="1.8" />
      <path d="M370 143 c0 2.5 7 4 16 4 s16 -1.5 16 -4" fill="none" stroke="#818CF8" stroke-width="1.8" />

      <text x="406" y="134" class="label">Cloud Storage</text>
      <text x="406" y="150" class="sub">RAW photo chunk store</text>
      <text x="406" y="164" class="sub">Deduplication &amp; archival</text>

      <!-- Pill -->
      <rect x="360" y="168" width="96" height="18" rx="4" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="366" y="180.5" class="tag" fill="#C7D2FE">GCP BUCKET</text>
    </g>

    <!-- Intra-Tier Connector 2A -> 2B -->
    <g>
      <line x1="465" y1="198" x2="465" y2="230" stroke="#818CF8" stroke-width="2" marker-end="url(#arrow-indigo)" />
      <rect x="473" y="206" width="94" height="18" rx="4" fill="#0F172A" stroke="#818CF8" stroke-width="0.8" />
      <text x="477" y="218.5" class="mono" font-size="8" font-weight="600" fill="#A5B4FC">TRIGGER FUNC</text>
    </g>

    <!-- Node 2B: Firestore DB & RBAC -->
    <g filter="url(#glow-indigo)">
      <rect x="346" y="234" width="238" height="110" rx="10" fill="url(#card-grad)" stroke="url(#border-indigo)" stroke-width="1.4" />
      <!-- Icon: Firestore Flame -->
      <rect x="360" y="248" width="36" height="36" rx="8" fill="#EA580C" fill-opacity="0.2" stroke="#FB923C" stroke-width="1" />
      <path d="M378 253 c1 4 -2 7 -2 10 c0 5 4 8 8 8 c5 0 8 -4 8 -9 c0 -6 -6 -9 -6 -13 c-1 4 -3 5 -5 6 c-1 -2 -2 -5 -3 -2 z" fill="#FB923C" />

      <text x="406" y="262" class="label">Firestore Realtime DB</text>
      <text x="406" y="278" class="sub">Document metadata indexing</text>
      <text x="406" y="292" class="sub">Role-Based Access Control</text>

      <!-- Badges -->
      <rect x="360" y="306" width="102" height="18" rx="4" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="366" y="318.5" class="tag" fill="#C7D2FE">RBAC SECURITY</text>

      <rect x="468" y="306" width="102" height="18" rx="4" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="474" y="318.5" class="tag" fill="#C7D2FE">MICROSEC SYNC</text>
    </g>
  </g>

  <!-- Flow Connector: DB -> Presentation -->
  <g>
    <path d="M 584 289 C 605 289, 610 152, 648 152" fill="none" stroke="#34D399" stroke-width="2.2" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)" />
    <!-- Connector Badge -->
    <rect x="590" y="200" width="88" height="24" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
    <text x="596" y="215" class="mono" font-size="8.5" font-weight="700" fill="#6EE7B7">SYNC STREAM</text>
  </g>

  <!-- ==================== TIER 3: PRESENTATION ==================== -->
  <g id="tier-3">
    <!-- Zone Container -->
    <rect x="650" y="58" width="250" height="302" rx="12" fill="url(#tier-pres)" stroke="#10B981" stroke-opacity="0.25" stroke-width="1.2" />
    <rect x="662" y="70" width="160" height="22" rx="6" fill="#065F46" fill-opacity="0.4" stroke="#34D399" stroke-width="1" />
    <text x="670" y="85" class="mono" font-size="10" font-weight="700" fill="#6EE7B7" letter-spacing="0.5">STAGE 03 // PRESENTATION</text>

    <!-- Node 3A: Live Photo Grid -->
    <g filter="url(#glow-emerald)">
      <rect x="664" y="106" width="222" height="92" rx="10" fill="url(#card-grad)" stroke="url(#border-emerald)" stroke-width="1.4" />
      <!-- Icon: Monitor / Grid -->
      <rect x="678" y="120" width="36" height="36" rx="8" fill="#059669" fill-opacity="0.25" stroke="#34D399" stroke-width="1" />
      <rect x="686" y="128" width="20" height="14" rx="2" fill="none" stroke="#34D399" stroke-width="1.6" />
      <path d="M691 146 h10 M696 142 v4" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" />

      <text x="724" y="134" class="label">Live Event Wall</text>
      <text x="724" y="150" class="sub">Real-time snapshot feed</text>
      <text x="724" y="164" class="sub">Zero refresh needed</text>

      <!-- Pill -->
      <rect x="678" y="168" width="108" height="18" rx="4" fill="#0F172A" stroke="#34D399" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="684" y="180.5" class="tag" fill="#A7F3D0">LIVE PROJECTION</text>
    </g>

    <!-- Intra-Tier Connector 3A -> 3B -->
    <line x1="775" y1="198" x2="775" y2="230" stroke="#34D399" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-emerald)" />

    <!-- Node 3B: Host Control & Bulk Download -->
    <g filter="url(#glow-emerald)">
      <rect x="664" y="234" width="222" height="110" rx="10" fill="url(#card-grad)" stroke="url(#border-emerald)" stroke-width="1.4" />
      <!-- Icon: Host / Archive -->
      <rect x="678" y="248" width="36" height="36" rx="8" fill="#059669" fill-opacity="0.25" stroke="#34D399" stroke-width="1" />
      <path d="M696 256 v12 M691 263 l5 5 l5 -5 M686 273 h20" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

      <text x="724" y="262" class="label">Host Console</text>
      <text x="724" y="278" class="sub">1-Click Bulk ZIP export</text>
      <text x="724" y="292" class="sub">Live content moderation</text>

      <!-- Badges -->
      <rect x="678" y="306" width="94" height="18" rx="4" fill="#0F172A" stroke="#34D399" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="684" y="318.5" class="tag" fill="#A7F3D0">BULK EXPORT</text>

      <rect x="778" y="306" width="96" height="18" rx="4" fill="#0F172A" stroke="#34D399" stroke-opacity="0.4" stroke-width="0.8" />
      <text x="784" y="318.5" class="tag" fill="#A7F3D0">MODERATION</text>
    </g>
  </g>
</svg>
