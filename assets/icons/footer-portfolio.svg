<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2436" />
      <stop offset="50%" stop-color="#101622" />
      <stop offset="100%" stop-color="#0A0E17" />
    </linearGradient>
    <linearGradient id="p-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Dark Translucent Glass Squircle Button (Image 2 style) -->
  <rect x="12" y="8" width="76" height="76" rx="23" fill="url(#p-bg)" stroke="url(#p-border)" stroke-width="1.6" filter="url(#shadow)" />

  <!-- Clean Outlined Portfolio / Globe Web Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(50, 46) scale(1.6) translate(-12, -12)">
    <circle cx="12" cy="12" r="10" />
    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
    <path d="M2 12h20" />
  </g>

  <!-- Clean Centered Label -->
  <text x="50" y="108" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="0.2">Portfolio</text>
</svg>